name: update-win10-22h2-x64
on:
  workflow_dispatch:
  schedule:
    - cron: "26 20 18 * *"
permissions:
  contents: write
  actions: write
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  update-win10-22h2-x64:
    runs-on: windows-latest
    timeout-minutes: 300
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Step-1 Checkout Win_ISO_Patching_Scripts
        shell: pwsh
        working-directory: .
        run: |
          $maxAttempts = 5
          $delaySeconds = 30
          $repoUrl = 'https://github.com/adavak/Win_ISO_Patching_Scripts.git'
          for ($i = 1; $i -le $maxAttempts; $i++) {
            Write-Host "Cloning patch scripts (attempt $i/$maxAttempts)..."
            if (Test-Path patcherScripts) { Remove-Item patcherScripts -Recurse -Force }
            & git clone --depth 1 $repoUrl patcherScripts
            if ($LASTEXITCODE -eq 0) {
              Write-Host "Clone succeeded"
              break
            }
            Write-Host "git clone failed with exit code $LASTEXITCODE"
            if ($i -lt $maxAttempts) {
              Write-Host "Retrying in $delaySeconds seconds..."
              Start-Sleep -Seconds $delaySeconds
            } else {
              throw "git clone failed after $maxAttempts attempts"
            }
          }
      - name: Step-2 Download from Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        working-directory: ./patcherScripts
        run: |
          gh release download win10-22h2-x64 --repo vaesn/win-iso-archive --pattern "*d4e92df7.7z.*" --dir ./
          7z x *.7z.001 -y
          Start-Sleep -Seconds 3
          Rename-Item -Path "*d4e92df7.iso" -NewName "win10biz22h2x64.iso"
          Remove-Item -Path "*.7z.*" -Force
          New-Item -ItemType Directory -Force -Path "assets"
          Move-Item -Path "../W10UI.ini" -Destination "./W10UI.ini" -Force
          Remove-Item -Path "../Drivers/ALL/w11" -Recurse -Force
          Get-ChildItem -Recurse -File -Force | Where-Object { $_.FullName -notmatch '\\(Drivers|\.git|\.github)(\\|$)' }

      - name: Step-3 Update By Win_ISO_Patching_Scripts
        shell: pwsh
        working-directory: ./patcherScripts
        run: |
          Copy-Item ../autounattend.xml . -Force
          $c = [IO.File]::ReadAllText('Start.cmd')
          if ($c -notmatch 'autounattend') {
            $line = 'if exist "%~dp0autounattend.xml" copy /y "%~dp0autounattend.xml" "%~dp0%ISODir%\autounattend.xml" >nul'
            [IO.File]::WriteAllText('Start.cmd', $c.Replace('call W10UI.cmd', "$line`r`ncall W10UI.cmd"))
          }
          & cmd /c "(echo 9 & echo 9 & echo 9) | Start.cmd" 2>&1 | Tee-Object -FilePath "./update-win10-22h2-x64.log" -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw "Start.cmd failed with exit code $LASTEXITCODE" }

      - name: Step-4 Split Archive
        shell: pwsh
        working-directory: .
        run: |
          $SourceDir    = "./patcherScripts/assets"
          $DistDir      = "dist_win10biz22h2x64"
          $RevisionName = "win10-22h2-x64"
          $MaxVolMB     = 1895
          $Reserve      = 8
          $MaxDiffMB    = 64

          New-Item -Path $DistDir -ItemType Directory -Force | Out-Null
          Remove-Item -Path "./patcherScripts/win10biz22h2x64.iso" -Force -ErrorAction SilentlyContinue
          $Iso = Get-ChildItem -Path $SourceDir -Filter "*.iso" -File | Select-Object -First 1

          $BaseName  = $Iso.BaseName
          $IsoLength = $Iso.Length
          $IsoDir    = $Iso.DirectoryName
          $IsoFull   = $Iso.FullName

          $FullHash = (Get-FileHash -Path $IsoFull -Algorithm SHA256).Hash.ToLower()
          $ShortHash = $FullHash.Substring($FullHash.Length - 8)
          $NewFileName = "${BaseName}_${ShortHash}.iso"
          $NewFilePath = Join-Path -Path $IsoDir -ChildPath $NewFileName
          Rename-Item -Path $IsoFull -NewName $NewFileName -Force

          $Revision    = $BaseName.Split('-')[0]
          $SizeInMB    = $IsoLength / 1MB
          $SizeInGB    = $IsoLength / 1GB

          $TotalMB = [Math]::Ceiling($SizeInMB)
          $N       = [Math]::Ceiling($TotalMB / ($MaxVolMB - $Reserve))
          $S       = [Math]::Ceiling($TotalMB / $N) + $Reserve
          $Last    = $TotalMB - $S * ($N - 1)
          $Diff    = $S - $Last

          $VolumeSizeArg = "${S}M"

          $EnvVars = @(
            "ISO_SIZEMB={0:N2} MB" -f $SizeInMB
            "ISO_SIZEGB={0:N2} GB" -f $SizeInGB
            "VOLUME_SIZE=$VolumeSizeArg"
            "VOLUME_COUNT=$N"
            "VOLUME_LAST=${Last}M"
            "VOLUME_DIFF=$Diff"
            "ISO_NAME=$NewFileName"
            "ISO_PATH=$NewFilePath"
            "ISO_REVISION=$Revision"
            "REVISION_NAME=$RevisionName"
            "SHA256=$FullHash"
          )
          $EnvVars | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host "========================================" -ForegroundColor Cyan
          Write-Host "  ISO Processing Information" -ForegroundColor Cyan
          Write-Host "========================================" -ForegroundColor Cyan
          @(
            "文件名: $NewFileName"
            "大小 : {0:N2} MB" -f $SizeInMB
            "大小 : {0:N2} GB" -f $SizeInGB
            "路径 : $NewFilePath"
            "版本 : $Revision"
            "SHA256: $FullHash"
            "分卷参数: -v$VolumeSizeArg"
            "分卷数: $N"
            "最后一卷: ${Last} MB"
            "差值: $Diff MB"
          ) | ForEach-Object { Write-Host "  $_" }
          Write-Host "========================================" -ForegroundColor Cyan

          $OutputZipFileName = "${RevisionName}-${Revision}.7z"
          $OutputZipPath = Join-Path -Path $DistDir -ChildPath $OutputZipFileName
          Write-Host "VolumeSizeArg : 7z a -t7z -v$VolumeSizeArg -mx=0 $OutputZipPath $NewFilePath"

          & 7z a -t7z -v"$VolumeSizeArg" -mx=0 "$OutputZipPath" "$NewFilePath"

          Write-Host "Generated archive: $OutputZipPath"
          Get-ChildItem -Recurse -File -Force | Where-Object { $_.FullName -notmatch '\\(Drivers|\.git|\.github)(\\|$)' }
          Write-Host "Split Archive Done..." -ForegroundColor Green

          Get-ChildItem "./dist_win10biz22h2x64" -File -ErrorAction SilentlyContinue | Sort-Object Name | ForEach-Object {
            Write-Host ("  {0}  {1:N2} MB" -f $_.Name, ($_.Length / 1MB))
          }

          $vols = Get-ChildItem "./dist_win10biz22h2x64/*.7z.*"
          $max = ($vols | Measure-Object Length -Maximum).Maximum / 1MB
          $min = ($vols | Measure-Object Length -Minimum).Minimum / 1MB
          Write-Host ("最大卷: {0:N2} MB" -f $max)
          Write-Host ("最小卷: {0:N2} MB" -f $min)
          Write-Host ("差值  : {0:N2} MB" -f ($max - $min))

          $repo = $env:GITHUB_REPOSITORY
          $tag  = $RevisionName
          $baseUrl = "https://v4.gh-proxy.org/https://github.com/$repo/releases/download/$tag"
          $parts = @(
            Get-ChildItem -Path $DistDir -File |
              Where-Object { $_.Name -match '\.7z\.\d+$' } |
              Sort-Object { [int]($_.Name -replace '^.*\.7z\.', '') }
          )
          if ($parts.Count -eq 0) {
            throw "No 7z volume files found in $DistDir"
          }
          $firstPart = $parts[0].Name
          $lastPart  = $parts[-1].Name
          $partCount = $parts.Count
          $tableRows = ($parts | ForEach-Object {
            $name = $_.Name
            $urlName = [uri]::EscapeDataString($name)
            $idx = [int]($name -replace '^.*\.7z\.', '')
            $ext = [regex]::Match($name, '\.7z\.\d+$').Value
            "| $idx | ``$name`` | [下载$ext]($baseUrl/$urlName) |"
          }) -join "`n"
          $downloadLinks = @(
            "| 分卷 | 文件名 | 链接 |"
            "| --- | --- | --- |"
            $tableRows
          ) -join "`n"
          @(
            "FIRST_PART=$firstPart"
            "LAST_PART=$lastPart"
            "PART_COUNT=$partCount"
            "DOWNLOAD_BASE_URL=$baseUrl"
            "DOWNLOAD_LINKS<<EOF"
            $downloadLinks
            "EOF"
          ) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "========================================" -ForegroundColor Cyan
          Write-Host "  Dynamic Download Links" -ForegroundColor Cyan
          Write-Host "========================================" -ForegroundColor Cyan
          Write-Host "Base URL      : $baseUrl"
          Write-Host "First Part    : $firstPart"
          Write-Host "Last Part     : $lastPart"
          Write-Host "Part Count    : $partCount"
          Write-Host "Download Links:"
          Write-Host $downloadLinks
          Write-Host "========================================" -ForegroundColor Cyan

      - name: Step-5 Delete Old Release
        if: ${{ always() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: gh release delete "${{ env.REVISION_NAME }}" --cleanup-tag -y || true

      - name: Step-6 Delete past completed runs of this workflow
        if: ${{ always() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh run list \
            --repo "${{ github.repository }}" \
            --workflow "${{ github.workflow }}" \
            --limit 100 \
            --json databaseId,status \
            --jq '.[] | select(.status=="completed") | .databaseId' | while read -r run_id; do
              if [ -z "$run_id" ]; then continue; fi
              if [ "$run_id" = "${{ github.run_id }}" ]; then continue; fi
              gh run delete "$run_id" --repo "${{ github.repository }}" || true
            done

      - name: Step-7 Build New Release
        uses: softprops/action-gh-release@v3
        with:
          fail_on_unmatched_files: true
          overwrite_files: true
          body: |
            ## windows10 22h2 x64 update zh_CN ${{ env.ISO_REVISION }}
            - **ARTIFACT**: ${{ env.ISO_NAME }}
            - **SHA256**: ${{ env.SHA256 }}
            - **File Size**: ${{ env.ISO_SIZEMB }} ， ${{ env.ISO_SIZEGB }}
            - **Volume Size**: ${{ env.VOLUME_SIZE }}
            - **Volume Count**: ${{ env.PART_COUNT }}
            - **ORIGINAL**: zh-cn_windows_10_business_editions_version_22h2_updated_oct_2025_x64_dvd_d4e92df7.iso
            ---
            ### 📦 下载说明
            使用 7-Zip 进行分卷压缩，每卷 ${{ env.VOLUME_SIZE }}，共 ${{ env.PART_COUNT }} 卷。

            **分卷下载链接**：

            ${{ env.DOWNLOAD_LINKS }}

            **下载方式**:
            1. 下载以上所有 `.7z.001`, `.7z.002`,`.7z.003` ... 等后缀的文件。
            2. 确保所有文件位于同一文件夹。
            3. 使用 7-Zip 解压 `${{ env.FIRST_PART }}` 即可获得完整的 ISO 文件。
            4. 使用 `https://gh-proxy.com/` 加速下载
            ---
            > ⚠️ **Note**: This is a multi-volume archive (.7z.001, .7z.002...). Please download all parts before extracting.
          tag_name: ${{ env.REVISION_NAME }}
          name: ${{ env.REVISION_NAME }}-${{ env.ISO_REVISION }}
          files: |
            ./dist_win10biz22h2x64/*.7z.*
            ./patcherScripts/*.log

      - name: Step-8 Update README
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $newTimeNOW = (Get-Date).ToUniversalTime().ToString("yyyy-MM-dd HH:mm:ss")
          $fileName = $env:ISO_NAME
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for ($i = 0; $i -lt 5; $i++) {
              git fetch origin main
              git reset --hard origin/main
              $readmeOriginal = Get-Content README.md -Raw -Encoding utf8
              $replacement = "<!-- win10-22h2-x64 -->`n$fileName ($newTimeNOW UTC)`n<!-- /win10-22h2-x64 -->"
              $readmeUpdated = [regex]::Replace(
                  $readmeOriginal,
                  '(?s)(<!-- win10-22h2-x64 -->).*?(<!-- /win10-22h2-x64 -->)',
                  { $replacement }
              )
              if ($readmeUpdated -eq $readmeOriginal) { break }
              [IO.File]::WriteAllText("$PWD/README.md", $readmeUpdated, [Text.UTF8Encoding]::new($false))
              git add README.md
              git commit -m "update"
              git push
              if ($LASTEXITCODE -eq 0) { break }
              Start-Sleep 3
          }
